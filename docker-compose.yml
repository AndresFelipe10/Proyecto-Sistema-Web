services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sistema_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - sistema_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: sistema_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sistema_network
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: sistema_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sistema_web}
      MYSQL_USER: ${DB_USERNAME:-sistema_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sistema_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sistema_root_password}
    ports:
      - "${FORWARD_DB_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sistema_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD:-sistema_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  sistema_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
