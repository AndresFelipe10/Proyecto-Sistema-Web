services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: sistema_app_prod
    restart: always
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - sistema_prod_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: sistema_nginx_prod
    restart: always
    ports:
      - "${PROD_PORT:-80}:80"
      - "${PROD_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    networks:
      - sistema_prod_network
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: sistema_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sistema_web}
      MYSQL_USER: ${DB_USERNAME:-sistema_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - sistema_prod_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sistema_prod_network:
    driver: bridge

volumes:
  mysql_prod_data:
    driver: local
  app_storage:
    driver: local
